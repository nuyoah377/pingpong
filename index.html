<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PONG</h1>
        </div>
        <div class="scoreboard">
            <div class="score">
                <span class="label">Player</span>
                <span class="score-value" id="playerScore">0</span>
            </div>
            <div class="divider">|</div>
            <div class="score">
                <span class="label">Computer</span>
                <span class="score-value" id="computerScore">0</span>
            </div>
        </div>
        <canvas id="pongCanvas"></canvas>
        <div class="instructions">
            <p><strong>Controls:</strong></p>
            <p>Mouse Y Position or Arrow Keys (↑ ↓) to move left paddle</p>
            <p>First to 10 points wins!</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
